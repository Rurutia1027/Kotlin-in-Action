name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify Maven & Java
        run: |
          java -version
          mvn -version

      # Step 1: Avro schemas -> Java sources (kafka-model only)
      - name: Generate Avro sources
        run: mvn -B generate-sources -pl infrastructure/kafka/kafka-model -am

      # Step 2: Compile generated Avro Java classes
      - name: Compile kafka-model
        run: mvn -B compile -pl infrastructure/kafka/kafka-model -am

      # Step 3: Build common Kotlin modules
      - name: Package common modules
        run: mvn -B package -DskipTests -pl common

      # Step 4: Full reactor — all currently enabled modules
      - name: Package (full reactor)
        run: mvn -B clean package -DskipTests

      - name: Upload kafka-model JAR
        uses: actions/upload-artifact@v4
        with:
          name: kafka-model-jar
          path: infrastructure/kafka/kafka-model/target/*.jar
          if-no-files-found: error
